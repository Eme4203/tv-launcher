name: Build & Release APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de la release (ej. v1.0.1)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Versión
        run: echo "VERSION_NAME=${TAG#v}" >> "$GITHUB_ENV"

      - name: Keystore (opcional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Compilar APK release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Preparar APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/TVLauncher.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TVLauncher
          path: dist/TVLauncher.apk

      - name: Publicar en Releases
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: TV Launcher ${{ env.TAG }}
          files: dist/TVLauncher.apk
          generate_release_notes: true
          body: |
            **Descarga directa:** https://github.com/${{ github.repository }}/releases/latest/download/TVLauncher.apk
